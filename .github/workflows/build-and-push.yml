name: Build and Deploy Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Backend/Dockerfile
          push: true
          tags: philipsen/finance-backend:latest

      - name: Build and push gnucash-sync image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gnucash-sync
          file: ./services/gnucash-sync/Dockerfile
          push: true
          tags: philipsen/finance-gnucash-sync:latest

      - name: Build and push integration-daemon image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./IntegrationDaemon/Dockerfile
          push: true
          tags: philipsen/finance-integration-daemon:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.production.yml
          target: compose/zonnewijzer-finance

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd compose/zonnewijzer-finance
            ./update-and-restart.sh
