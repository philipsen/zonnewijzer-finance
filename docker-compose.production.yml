services:
  gnucash-sync:
    # Pushed by .github/workflows/build-and-push.yml (same pattern as finance-backend)
    image: philipsen/finance-gnucash-sync:latest
    container_name: finance-gnucash-sync
    ports:
      - "8787:8787"
    environment:
      GNUCASH_POSTGRES_URL: ${GNUCASH_POSTGRES_URL:-}
      SYNC_API_KEY: ${GNUCASH_SYNC_API_KEY:-}
      INCOME_ACCOUNT: ${GNUCASH_INCOME_ACCOUNT:-Income:Charging}
      INVOICE_TAX_TABLE_NAME: ${GNUCASH_INVOICE_TAX_TABLE_NAME:-BTW hoog}
      INVOICE_AUTO_POST: ${GNUCASH_INVOICE_AUTO_POST:-true}
      INVOICE_POST_ACCOUNT: ${GNUCASH_INVOICE_POST_ACCOUNT:-}
      INVOICE_TAX_INCLUDED: ${GNUCASH_INVOICE_TAX_INCLUDED:-false}
      SEQ_SERVER_URL: ${GNUCASH_SEQ_SERVER_URL:-http://seq:80}
      SEQ_API_KEY: ${GNUCASH_SEQ_API_KEY:-}
    networks:
      - finance-network
      - seq-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8787/health\")"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    image: philipsen/finance-backend:latest
    container_name: finance-backend
    depends_on:
      - gnucash-sync
    ports:
      - "8080:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - IntegrationDaemon__ApiKey=${DAEMON_API_KEY:-}
      - Jwt__Key=${JWT_KEY}
      - GitHub__ClientId=${GITHUB_CLIENT_ID}
      - GitHub__ClientSecret=${GITHUB_CLIENT_SECRET}
      - Mollie__ApiKey=${MOLLIE_API_KEY}
      - Mollie__BaseUrl=https://zonnewijzer.zonneklaar-consulting.com
      - Mollie__RedirectUrl=https://zonnewijzer.zonneklaar-consulting.com/payment-return
      - GitHub__CallbackUrl=https://zonnewijzer.zonneklaar-consulting.com/api/auth/github/callback
      - GitHub__FrontendUrl=https://zonnewijzer.zonneklaar-consulting.com
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__Port=2525
      - GnuCashSync__BaseUrl=http://gnucash-sync:8787
      - GnuCashSync__ApiKey=${GNUCASH_SYNC_API_KEY}
      - FINANCE_BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
      - mailcow-ext
      - seq-network

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  integration-daemon:
    image: philipsen/finance-integration-daemon:latest
    container_name: finance-integration-daemon
    depends_on:
      - backend
    env_file:
      - path: IntegrationDaemon/.env
        required: false
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:7071
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - DaemonApi__ApiKey=${DAEMON_API_KEY:-}
      - Sigenergy__BaseUrl=${SIGENERGY_BASE_URL:-https://api-eu.sigencloud.com}
      - Sigenergy__Username=${SIGENERGY_USERNAME:-}
      - Sigenergy__Password=${SIGENERGY_PASSWORD:-}
      - Sigenergy__SystemId=${SIGENERGY_SYSTEM_ID:-}
      - Sigenergy__UsableBatteryCapacityKwh=${SIGENERGY_USABLE_BATTERY_CAPACITY_KWH:-}
      - SmappeeDaemon__Enabled=true
      - SmappeeDaemon__PollIntervalMinutes=5
      - SigenergyDaemon__Enabled=true
      - SigenergyDaemon__PollIntervalMinutes=5
    expose:
      - "7071"
    volumes:
      - ./data:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
      - seq-network
    restart: unless-stopped

networks:
  finance-network:
    driver: bridge
  mailcow-ext:
    external: true
  seq-network:
    name: seq_default
    external: true

volumes:
  database:
    driver: local
  logs:
    driver: local
