services:
  backend:
    image: philipsen/finance-backend:latest
    container_name: finance-backend
    ports:
      - "8080:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - IntegrationDaemon__ApiKey=${DAEMON_API_KEY:-}
      - Jwt__Key=${JWT_KEY}
      - GitHub__ClientId=${GITHUB_CLIENT_ID}
      - GitHub__ClientSecret=${GITHUB_CLIENT_SECRET}
      - Mollie__ApiKey=${MOLLIE_API_KEY}
      - Mollie__BaseUrl=https://zonnewijzer.zonneklaar-consulting.com
      - Mollie__RedirectUrl=https://zonnewijzer.zonneklaar-consulting.com/payment-return
      - GitHub__CallbackUrl=https://zonnewijzer.zonneklaar-consulting.com/api/auth/github/callback
      - GitHub__FrontendUrl=https://zonnewijzer.zonneklaar-consulting.com
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__Host=${SMTP_HOST:-mail.warmoestuin.nl}
      - Smtp__Port=${SMTP_PORT:-2525}
      - Smtp__SkipCertificateValidation=true
      - FINANCE_BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
      - mailcow-ext
      - seq-network

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  integration-daemon:
    image: philipsen/finance-integration-daemon:latest
    container_name: finance-integration-daemon
    depends_on:
      - backend
    env_file:
      - path: IntegrationDaemon/.env
        required: false
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:7071
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - DaemonApi__ApiKey=${DAEMON_API_KEY:-}
      - Smappee__BaseUrl=${SMAPPEE_BASE_URL:-https://app1pub.smappee.net/dev/v3}
      - Smappee__ClientId=${SMAPPEE_CLIENT_ID:-}
      - Smappee__ClientSecret=${SMAPPEE_CLIENT_SECRET:-}
      - Smappee__Username=${SMAPPEE_USERNAME:-}
      - Smappee__Password=${SMAPPEE_PASSWORD:-}
      - Smappee__ServiceLocationId=${SMAPPEE_SERVICE_LOCATION_ID:-}
      - Sigenergy__BaseUrl=${SIGENERGY_BASE_URL:-https://api-eu.sigencloud.com}
      - Sigenergy__Username=${SIGENERGY_USERNAME:-}
      - Sigenergy__Password=${SIGENERGY_PASSWORD:-}
      - Sigenergy__SystemId=${SIGENERGY_SYSTEM_ID:-}
      - Sigenergy__UsableBatteryCapacityKwh=${SIGENERGY_USABLE_BATTERY_CAPACITY_KWH:-}
      - SmappeeDaemon__Enabled=true
      - SmappeeDaemon__PollIntervalMinutes=5
      - SigenergyDaemon__Enabled=true
      - SigenergyDaemon__PollIntervalMinutes=5
      - SEQ_SERVER_URL=${DAEMON_SEQ_SERVER_URL:-http://seq:80}
    expose:
      - "7071"
    volumes:
      - ./data:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
      - seq-network
    restart: unless-stopped

networks:
  finance-network:
    driver: bridge
  mailcow-ext:
    external: true
  seq-network:
    name: seq_default
    external: true

volumes:
  database:
    driver: local
  logs:
    driver: local
