services:                                                                                                                                                                                                                                          
  backend:                                                                                                                                                                                                                                         
    image: philipsen/finance-backend:latest                                                                                                                                                                                                        
    container_name: finance-backend                                                                                                                                                                                                                
    ports:                                                                                                                                                                                                                                         
      - "5000:5000"                                                                                                                                                                                                                                
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - Jwt__Key=${JWT_KEY}
      - GitHub__ClientId=${GITHUB_CLIENT_ID}
      - GitHub__ClientSecret=${GITHUB_CLIENT_SECRET}
      - Mollie__ApiKey=${MOLLIE_API_KEY}
      - Mollie__BaseUrl=https://zonnewijzer.zonneklaar-consulting.com
      - Mollie__RedirectUrl=https://zonnewijzer.zonneklaar-consulting.com/payment-return
      - GitHub__CallbackUrl=https://zonnewijzer.zonneklaar-consulting.com/api/auth/github/callback
      - GitHub__FrontendUrl=https://zonnewijzer.zonneklaar-consulting.com
    volumes:                                                                                                                                                                                                                                       
      - ./data:/app/database                                                                                                                                                                                                                       
      - ./logs:/app/logs                                                                                                                                                                                                                           
    networks:                                                                                                                                                                                                                                      
      - finance-network                                                                                                                                                                                                                            
      - mailcow-ext                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                   
    restart: unless-stopped                                                                                                                                                                                                                        
    healthcheck:                                                                                                                                                                                                                                   
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]                                                                                                                                                                                  
      interval: 30s                                                                                                                                                                                                                                
      timeout: 10s                                                                                                                                                                                                                                 
      retries: 3                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                   
  frontend:                                                                                                                                                                                                                                        
    image: philipsen/finance-frontend:latest                                                                                                                                                                                                       
    container_name: finance-frontend                                                                                                                                                                                                               
    ports:                                                                                                                                                                                                                                         
      - "3000:80"                                                                                                                                                                                                                                  
    networks:                                                                                                                                                                                                                                      
      - finance-network                                                                                                                                                                                                                            
      - mailcow-ext                                                                                                                                                                                                                                
    restart: unless-stopped                                                                                                                                                                                                                        
    healthcheck:                                                                                                                                                                                                                                   
      test: ["CMD", "curl", "-f", "http://localhost:80"]                                                                                                                                                                                           
      interval: 30s                                                                                                                                                                                                                                
      timeout: 10s                                                                                                                                                                                                                                 
      retries: 3                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                   
  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - finance-network
      - mailcow-ext
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                   
networks:                                                                                                                                                                                                                                          
  finance-network:                                                                                                                                                                                                                                 
    driver: bridge                                                                                                                                                                                                                                 
  mailcow-ext:                                                                                                                                                                                                                                     
    external: true                                                                                                                                                                                                                                 
                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                   
volumes:                                                                                                                                                                                                                                           
  database:                                                                                                                                                                                                                                        
    driver: local                                                                                                                                                                                                                                  
  logs:                                                                                                                                                                                                                                            
    driver: local



