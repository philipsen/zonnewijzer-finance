<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance App</title>
    <!-- Google requires ?onload= so the callback runs when the library is ready (Safari / slow mobile). -->
    <script>
      window.__googleGsiOnLoad = function () {
        window.__googleGsiReady = true
        window.dispatchEvent(new Event('google-gsi-ready'))
      }
    </script>
    <script src="https://accounts.google.com/gsi/client?onload=__googleGsiOnLoad" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
