services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    image: finance-backend:local
    container_name: finance-backend
    # Loads FINANCE_BOOTSTRAP_ADMIN_PASSWORD and optional local secrets (same as Backend dev); do not
    # duplicate FINANCE_BOOTSTRAP_ADMIN_PASSWORD in `environment` or an empty default overrides this.
    env_file:
      - path: Backend/.env
        required: false
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - IntegrationDaemon__ApiKey=${DAEMON_API_KEY:-}
      - Serilog__WriteTo__1__Args__serverUrl=http://host.docker.internal:5341
      # appsettings.Production.json sets Jwt:Key to empty; must override or JWT auth crashes (IDX10703)
      - Jwt__Key=${JWT_KEY:-your-super-secret-jwt-key-that-should-be-at-least-256-bits-long}
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
    restart: unless-stopped

  integration-daemon:
    build:
      context: .
      dockerfile: IntegrationDaemon/Dockerfile
    image: finance-integration-daemon:local
    container_name: finance-integration-daemon
    depends_on:
      - backend
    env_file:
      - path: IntegrationDaemon/.env
        required: false
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:7071
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/finance.db
      - DaemonApi__ApiKey=${DAEMON_API_KEY:-}
      - Smappee__BaseUrl=${SMAPPEE_BASE_URL:-https://app1pub.smappee.net/dev/v3}
      - Smappee__ClientId=${SMAPPEE_CLIENT_ID:-}
      - Smappee__ClientSecret=${SMAPPEE_CLIENT_SECRET:-}
      - Smappee__Username=${SMAPPEE_USERNAME:-}
      - Smappee__Password=${SMAPPEE_PASSWORD:-}
      - Smappee__ServiceLocationId=${SMAPPEE_SERVICE_LOCATION_ID:-}
      - Sigenergy__BaseUrl=${SIGENERGY_BASE_URL:-https://api-eu.sigencloud.com}
      - Sigenergy__Username=${SIGENERGY_USERNAME:-}
      - Sigenergy__Password=${SIGENERGY_PASSWORD:-}
      - Sigenergy__SystemId=${SIGENERGY_SYSTEM_ID:-}
      - Sigenergy__UsableBatteryCapacityKwh=${SIGENERGY_USABLE_BATTERY_CAPACITY_KWH:-}
      - SmappeeDaemon__Enabled=true
      - SmappeeDaemon__PollIntervalMinutes=5
      - SigenergyDaemon__Enabled=true
      - SigenergyDaemon__PollIntervalMinutes=5
      - SEQ_SERVER_URL=${DAEMON_SEQ_SERVER_URL:-http://host.docker.internal:5341}
    ports:
      - "7071:7071"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    networks:
      - finance-network
    restart: unless-stopped

networks:
  finance-network:
    driver: bridge
